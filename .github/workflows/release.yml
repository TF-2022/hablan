name: Release

# Releases are intentional, driven by a version tag — NOT by every push to main.
# Cut a release locally with `npm run release` (bumps package.json, commits
# "release: vX", tags vX, pushes main + tags). The pushed tag triggers this
# workflow. Pushing plain code to main no longer builds or publishes anything.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build & publish, e.g. v1.0.11"
        required: true

# One build per tag. Don't cancel an in-flight release if re-triggered.
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # whisper.cpp + ffmpeg are large pre-built downloads; the download script
      # is idempotent (skips files that exist), so a restored cache short-circuits
      # it. Key on the script so a URL/version change busts the cache.
      - name: Cache native binaries
        id: cache-bin
        uses: actions/cache@v4
        with:
          path: resources/bin
          key: win-bin-v1-${{ hashFiles('scripts/download-binaries.mjs') }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Download whisper.cpp + ffmpeg
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: node scripts/download-binaries.mjs

      - name: Build & Package
        run: npm run build && npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    # Bump this suffix to force a fresh whisper.cpp compile (e.g. to pick up a
    # newer upstream). Otherwise the compiled+signed binaries are reused.
    env:
      MAC_BIN_CACHE: v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Compiling whisper.cpp from source is the slowest, most flaky step (git
      # clone + cmake). Cache the compiled, ad-hoc-signed binaries. On an exact
      # hit the heavy block is skipped; any miss recompiles, so this can only
      # speed things up — never break a release.
      - name: Cache compiled macOS binaries
        id: cache-mac-bin
        uses: actions/cache@v4
        with:
          path: resources/bin/mac
          key: mac-bin-${{ env.MAC_BIN_CACHE }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate icons
        run: node scripts/generate-icons.mjs

      - name: Build whisper.cpp (static) + download ffmpeg (static)
        if: steps.cache-mac-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p resources/bin/mac

          # whisper.cpp — build from source with static linking + Metal embedded
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-build
          cd /tmp/whisper-build
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=ON
          cmake --build build -j$(sysctl -n hw.ncpu) --config Release
          cp build/bin/whisper-cli $GITHUB_WORKSPACE/resources/bin/mac/whisper-cli
          cp build/bin/whisper-server $GITHUB_WORKSPACE/resources/bin/mac/whisper-server || true
          cd $GITHUB_WORKSPACE

          # ffmpeg — static build from eugeneware/ffmpeg-static (no .dylib deps)
          curl -L -o ffmpeg.gz "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-arm64.gz"
          gunzip -f ffmpeg.gz
          mv ffmpeg resources/bin/mac/ffmpeg

          chmod +x resources/bin/mac/*

          # Ad-hoc sign each binary so they share a consistent signature inside the .app
          codesign --force --sign - resources/bin/mac/whisper-cli
          codesign --force --sign - resources/bin/mac/whisper-server 2>/dev/null || true
          codesign --force --sign - resources/bin/mac/ffmpeg

          echo "=== Binaries ==="
          ls -la resources/bin/mac/
          file resources/bin/mac/*
          echo "=== Dylib check ==="
          otool -L resources/bin/mac/ffmpeg || true
          otool -L resources/bin/mac/whisper-cli || true

      - name: Build & Package
        run: |
          npm run build
          npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  publish-release:
    needs: [build-windows, build-macos]
    if: always() && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release edit "$TAG" --draft=false --latest 2>/dev/null \
            || gh release create "$TAG" --title "$TAG" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
